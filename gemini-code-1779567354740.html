<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - Morphklik Media</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #F6F4EB; /* Matches the warm cream background */
            color: #2B2B2B;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Container for central content */
        .container {
            max-width: 800px;
            padding: 40px 20px;
            z-index: 2;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo Styling */
        .logo {
            max-width: 450px;
            width: 100%;
            height: auto;
            margin-bottom: 50px;
        }

        /* Typography */
        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            color: #222;
        }

        p.message {
            font-size: 1.35rem;
            line-height: 1.5;
            margin-bottom: 60px;
            max-width: 700px;
            color: #111;
        }

        /* Footer */
        .footer {
            font-size: 1.1rem;
            color: #111;
            position: absolute;
            bottom: 40px;
            width: 100%;
        }

        /* Faint Decorative Background Gears */
        .gear {
            position: absolute;
            opacity: 0.04; /* Very faint to match the design */
            z-index: 1;
        }
        
        .gear-left {
            top: 50%;
            left: 10%;
            width: 180px;
            transform: translateY(-50%);
        }
        
        .gear-right {
            top: 45%;
            right: 12%;
            width: 150px;
            transform: translateY(-50%);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            p.message { font-size: 1.1rem; padding: 0 15px; }
            .logo { max-width: 300px; margin-bottom: 30px; }
            .gear { display: none; } /* Hide gears on small screens to reduce clutter */
        }
    </style>
</head>
<body>

    <svg class="gear gear-left" viewBox="0 0 100 100" fill="none" stroke="#000" stroke-width="2">
        <circle cx="40" cy="40" r="20"/>
        <path d="M40 10 V15 M40 65 V70 M10 40 H15 M65 40 H70 M18 18 L22 22 M58 58 L62 62 M18 62 L22 58 M58 18 L62 22" stroke-width="4"/>
        <circle cx="75" cy="75" r="15"/>
        <path d="M75 50 V55 M75 95 V100 M50 75 H55 M95 75 H100 M57 57 L60 60 M90 90 L93 93 M57 93 L60 90 M90 57 L93 60" stroke-width="3"/>
    </svg>

    <svg class="gear gear-right" viewBox="0 0 100 100" fill="none" stroke="#000" stroke-width="2">
        <circle cx="50" cy="50" r="30"/>
        <circle cx="50" cy="50" r="10"/>
        <path d="M50 10 V15 M50 85 V90 M10 50 H15 M85 50 H90 M22 22 L26 26 M74 74 L78 78 M22 78 L26 74 M74 22 L78 26" stroke-width="5"/>
        <circle cx="85" cy="20" r="10"/>
        <path d="M85 0 V5 M85 35 V40 M65 20 H70 M100 20 H105 M68 3 M71 6 M99 37 L102 40 M68 37 L71 34 M99 3 L102 0" stroke-width="2"/>
    </svg>

    <div class="container">
        <img src="logo2.jpg" alt="Morphklik Media" class="logo">
        
        <h1>Under Maintenance</h1>
        
        <p class="message">
            We are currently enhancing our services to bring you a<br>
            better experience. We'll be back up and running very soon.<br>
            Thank you for your patience.
        </p>
    </div>

    <div class="footer">
        © 2024 Morphklik Media. All rights reserved.
    </div>

</body>
</html>
