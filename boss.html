<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOSS PANEL | MorphKlik Media</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root { --admin-bg: #08080f; }
    body { background: var(--admin-bg); cursor: default !important; }
    .admin-container { max-width: 1000px; margin: 100px auto; padding: 2rem; }
    .admin-header { border-bottom: 1px solid rgba(255,255,255,.1); padding-bottom: 2rem; margin-bottom: 3rem; }
    .admin-header h1 { font-family: var(--font-head); color: var(--gold); font-size: 2.5rem; text-transform: uppercase; }
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; }
    .admin-section { background: rgba(255,255,255,.03); padding: 2rem; border: 1px solid rgba(255,255,255,.05); }
    .admin-section h2 { font-family: var(--font-head); color: var(--cream); font-size: 1.2rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--gold); display: inline-block; padding-bottom: .3rem; }
    
    .admin-form { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
    .admin-input, .admin-select { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); padding: .8rem; color: var(--cream); font-family: var(--font-body); }
    .admin-btn { background: var(--gold); color: var(--navy); border: none; padding: 1rem; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all .3s; }
    .admin-btn:hover { background: var(--cream); }
    .admin-btn.danger { background: #ff4444; color: white; padding: .4rem .8rem; font-size: .7rem; }
    
    .admin-list { max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: .8rem; }
    .admin-item { background: rgba(255,255,255,.05); padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--gold); }
    .admin-item-info span { display: block; font-size: .7rem; color: var(--gold); text-transform: uppercase; }
    .admin-item-info p { font-size: .85rem; color: var(--cream); }

    #login-overlay { position: fixed; inset: 0; background: var(--admin-bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
    .login-box { text-align: center; }
    .login-box input { display: block; width: 300px; margin: 1rem 0; padding: 1rem; background: transparent; border: 1px solid var(--gold); color: var(--gold); text-align: center; font-size: 1.2rem; letter-spacing: .5em; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body style="cursor: auto;">
  
  <div id="login-overlay">
    <div class="login-box">
      <h2 style="color:var(--gold); font-family:var(--font-head); letter-spacing: .2em;">ACCESS KEY</h2>
      <input type="password" id="boss-pass" placeholder="••••">
      <button class="admin-btn" onclick="checkPass()">ENTER</button>
    </div>
  </div>

  <div class="admin-container">
    <header class="admin-header">
      <h1>Boss Panel</h1>
      <p style="color:rgba(255,255,255,.4);">Manage your agency empire. <a href="index.html" style="color:var(--gold);">Back to Site</a></p>
    </header>

    <div class="admin-grid">
      <!-- PORTFOLIO MANAGER -->
      <section class="admin-section">
        <h2>Manage Portfolio</h2>
        <form class="admin-form" id="project-form">
          <select class="admin-select" id="proj-service" required>
            <option value="video-production">Video Production</option>
            <option value="photography">Photography</option>
            <option value="drone-shoots">Drone Shoots</option>
            <option value="reels-shortform">Reels & Short-form</option>
            <option value="motion-graphics">Motion Graphics</option>
            <option value="social-media-marketing">Social Media Marketing</option>
            <option value="web-developing">Web Development</option>
          </select>
          <input type="text" class="admin-input" id="proj-title" placeholder="Project Title" required>
          <input type="text" class="admin-input" id="proj-role" placeholder="Role (e.g. Brand Film)" required>
          <input type="text" class="admin-input" id="proj-media" placeholder="Image Path (e.images/work1.png)" required>
          <button type="submit" class="admin-btn">Add Project</button>
        </form>

        <div class="admin-list" id="project-list">
          <!-- Projects will appear here -->
        </div>
      </section>

      <!-- REVIEW MANAGER -->
      <section class="admin-section">
        <h2>Manage Reviews</h2>
        <div class="admin-list" id="review-list">
          <!-- Reviews will appear here -->
        </div>
      </section>
    </div>
  </div>

  <script>
    const PASS = "1234"; // Simple pass for local use
    function checkPass() {
      if(document.getElementById('boss-pass').value === PASS) {
        document.getElementById('login-overlay').style.display = 'none';
      } else {
        alert("WRONG KEY");
      }
    }

    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = 'https://ymxizpcknnmrigujpnpc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlteGl6cGNrbm5tcmlndWpwbnBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Nzk1MzIsImV4cCI6MjA5NDM1NTUzMn0.2RKTkftK0-fFjHaAPRtUhPvCql04kkm4ExVFSwmRHyI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- LOGIC ---
    const loadProjects = async () => {
      const list = document.getElementById('project-list');
      const service = document.getElementById('proj-service').value;
      list.innerHTML = '<p style="color:white; font-size:0.7rem;">Loading...</p>';
      
      const { data, error } = await supabaseClient
        .from('projects')
        .select('*')
        .eq('service', service)
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        list.innerHTML = '<p style="color:red;">Error loading projects.</p>';
        return;
      }

      list.innerHTML = '';
      data.forEach(p => {
        const item = document.createElement('div');
        item.className = 'admin-item';
        item.innerHTML = `
          <div class="admin-item-info">
            <span>${p.role}</span>
            <p>${p.title}</p>
          </div>
          <button class="admin-btn danger" onclick="deleteProject(${p.id})">Delete</button>
        `;
        list.appendChild(item);
      });
    };

    const loadReviews = async () => {
      const list = document.getElementById('review-list');
      list.innerHTML = '<p style="color:white; font-size:0.7rem;">Loading...</p>';
      
      const { data, error } = await supabaseClient
        .from('reviews')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.warn("Reviews table might not exist yet. Run SQL first.");
        list.innerHTML = '<p style="color:rgba(255,255,255,0.3);">No reviews found (or table missing).</p>';
        return;
      }

      list.innerHTML = '';
      data.forEach(r => {
        const item = document.createElement('div');
        item.className = 'admin-item';
        item.innerHTML = `
          <div class="admin-item-info">
            <span>${r.name} (${r.role})</span>
            <p>${r.text.substring(0, 40)}...</p>
          </div>
          <button class="admin-btn danger" onclick="deleteReview(${r.id})">Delete</button>
        `;
        list.appendChild(item);
      });
    };

    document.getElementById('project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerText = 'SAVING...';
      btn.disabled = true;

      const projectData = {
        service: document.getElementById('proj-service').value,
        title: document.getElementById('proj-title').value,
        role: document.getElementById('proj-role').value,
        media: document.getElementById('proj-media').value
      };
      
      const { error } = await supabaseClient.from('projects').insert([projectData]);
      
      if (error) {
        alert("Error saving: " + error.message);
      } else {
        loadProjects();
        e.target.reset();
      }
      btn.innerText = 'Add Project';
      btn.disabled = false;
    });

    window.deleteProject = async (id) => {
      if(!confirm("Are you sure you want to delete this project?")) return;
      
      const { error } = await supabaseClient
        .from('projects')
        .delete()
        .eq('id', id);
        
      if (error) {
        console.error("Delete Error:", error);
        alert("Could not delete: " + error.message + "\n\nTip: Make sure you have added the 'DELETE' policy in Supabase SQL editor.");
      } else {
        loadProjects();
      }
    };

    window.deleteReview = async (id) => {
      if(!confirm("Are you sure you want to delete this review?")) return;
      
      const { error } = await supabaseClient
        .from('reviews')
        .delete()
        .eq('id', id);
        
      if (error) {
        console.error("Delete Error:", error);
        alert("Could not delete: " + error.message + "\n\nTip: Make sure you have added the 'DELETE' policy in Supabase SQL editor.");
      } else {
        loadReviews();
      }
    };

    document.getElementById('proj-service').addEventListener('change', loadProjects);
    
    // Init
    window.onload = () => {
      loadProjects();
      loadReviews();
    };
  </script>
</body>
</html>
